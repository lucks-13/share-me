[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shareme"
version = "0.1.0"
description = "Secure text based file sharing cli"
requires = ">=3.11"
dependencies = [
    "typer>=0.12",
    "cryptography>=42",
    "argon2_cffi>=23"
]
[project.scripts]
shareme = "shareme.cli:app"
[tool.setuptools.packages.find]
where = ["src"]